circle.walker { opacity: 0; animation: walk 11s ease-in-out infinite; }
@keyframes walk { 0.0% { transform: translate(560px, 430px); opacity: 1; } 11.7% { transform: translate(470px, 400px); opacity: 1; } 23.3% { transform: translate(430px, 330px); opacity: 1; } 35.0% { transform: translate(360px, 320px); opacity: 1; } 46.7% { transform: translate(340px, 280px); opacity: 1; } 58.3% { transform: translate(312px, 268px); opacity: 1; } 70.0% { transform: translate(303px, 258px); opacity: 1; } 92% { transform: translate(303px, 258px); opacity: 1; } 100% { transform: translate(303px, 258px); opacity: 0; } }
rect.bar { transform-box: fill-box; transform-origin: left center; animation: rerank ease-in-out infinite; }
@keyframes rerank { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.86); } }
