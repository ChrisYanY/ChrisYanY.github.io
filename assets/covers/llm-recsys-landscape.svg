<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true"><style>
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow10 { to { stroke-dashoffset: -20; } }
@keyframes flow11 { to { stroke-dashoffset: -22; } }

line.e { stroke: #5a6068; stroke-width: 1; opacity: var(--b); animation: fire ease-in-out infinite; }
@keyframes fire {
  0%, 55%, 100% { opacity: var(--b); stroke: #5a6068; stroke-width: 1; }
  75% { opacity: .95; stroke: #2B547E; stroke-width: 1.7; }
}
circle.pkt { opacity: 0; animation: pkt linear infinite; }
@keyframes pkt {
  0%   { transform: translate(var(--x1), var(--y1)); opacity: 0; }
  12%  { opacity: 1; }
  50%  { transform: translate(var(--x2), var(--y2)); opacity: 1; }
  58%, 100% { transform: translate(var(--x2), var(--y2)); opacity: 0; }
}
circle.hub { transform-box: fill-box; transform-origin: center; animation: breathe 4.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
