baseURL: "https://chrisyany.github.io/"
title: "Yan Yan"
copyright: "© 2026 Yan Yan"
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 40

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "EN"
    languageCode: en-US
    weight: 1
    params:
      description: "Notes on recommender systems, generative retrieval, and LLMs by Yan Yan."
  zh:
    languageName: "中文"
    title: "严严"
    languageCode: zh-CN
    weight: 2
    hasCJKLanguage: true
    params:
      description: "严严关于推荐系统、生成式召回与大模型的技术笔记。"

params:
  author: "Yan Yan"
  cv: "uploads/resume-yan.pdf"
  social:
    linkedin: "https://www.linkedin.com/in/chrisyany"
    scholar: "https://scholar.google.com/citations?user=rmMWS_kAAAAJ"
    github: "https://github.com/ChrisYanY"

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"], ["\\[", "\\]"]]
          inline: [["$", "$"], ["\\(", "\\)"]]
      table: true
      strikethrough: true
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

imaging:
  quality: 85

disableKinds: [taxonomy, term]
